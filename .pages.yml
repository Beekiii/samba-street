# Pages CMS (https://app.pagescms.org): the browser editor for the Journal.
# Every save is a commit to main, which puts the site online again in 1–2 minutes.
# The fields must match the schema in src/content.config.ts.

media:
  input: src/assets/journal
  # Path written into the posts, relative to src/content/journal/,
  # so Astro can find the photos and make smaller versions of them.
  output: ../../assets/journal
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    # The site only reads posts directly in this folder, not in subfolders.
    subfolders: false
    filename: "{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        description: One or two sentences. Shown in the list of posts and when someone shares the link.
        type: text
        required: true
      - name: cover
        label: Cover photo
        description: Shown big at the top of the post and in the lists. A landscape photo works best.
        type: image
        required: true
      - name: coverAlt
        label: Cover photo description
        description: Say in a few words what the photo shows, for people who can't see it.
        type: string
      - name: draft
        label: Draft
        description: Turn on to save without showing the post on the website yet.
        type: boolean
        default: false
      - name: body
        label: Text
        type: rich-text
